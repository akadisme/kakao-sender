name: Build KakaoSender EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install packages
        run: pip install -r requirements.txt pyinstaller
      - name: Build exe
        run: pyinstaller --onefile --noconsole --name KakaoSender kakao_sender.py
      - name: Collect files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item dist/KakaoSender.exe, config.json, register_task.ps1, register_task.bat -Destination package
      - uses: actions/upload-artifact@v4
        with:
          name: KakaoSender
          path: package/
